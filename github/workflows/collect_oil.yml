name: 유가 일일 수집

on:
  schedule:
    # 매일 KST 오전 10시 (UTC 01시). 오피넷 갱신 후 시간대.
    - cron: "0 1 * * *"
  workflow_dispatch:        # 수동 실행 버튼도 제공

permissions:
  contents: write           # CSV 커밋 권한

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests pandas

      - name: 유가 수집
        env:
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
        run: python collect_oil_price.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/oil_history.csv
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "유가 자동 수집: $(date +%Y-%m-%d)"
            git push
          fi

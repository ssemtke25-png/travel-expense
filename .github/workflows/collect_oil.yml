name: Collect Oil Price

# 매일 새벽 06:00 KST 에 전날 확정 유가를 수집한다.
# cron 은 UTC 기준 → KST 06:00 = UTC 21:00 (전날).
on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = KST 익일 06:00
  workflow_dispatch:        # 수동 실행 버튼도 허용

permissions:
  contents: write           # CSV 커밋/푸시 위해 필요

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pandas

      - name: Collect oil price
        env:
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
        run: python collect_oil_price.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/oil_history.csv
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: update oil_history.csv ($(date -u +%Y-%m-%d))"
            git push
          fi
